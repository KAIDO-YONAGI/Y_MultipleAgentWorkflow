name: validate

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Skill metadata
        shell: pwsh
        run: |
          python -m pip install pyyaml
          python ./tests/validate_skill.py ./src/skills/multiple-agent-workflow-config
      - name: Test distribution
        shell: pwsh
        run: ./scripts/Test-Distribution.ps1
      - name: Build packages
        shell: pwsh
        run: ./scripts/Build-Distribution.ps1
